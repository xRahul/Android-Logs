name: Automated Release & Version Bump

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:
    inputs:
      bump_type:
        description: "Semantic version bump type"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build Multi-Arch & Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Calculate Semantic Version & Version Code
        id: versioning
        run: |
          git fetch --tags --force || true
          LATEST_TAG=$(git tag -l "v*" --sort=-v:refname | head -n 1)

          if [ -z "$LATEST_TAG" ]; then
            echo "No prior tags found. Initializing at v1.0.0"
            MAJOR=1
            MINOR=0
            PATCH=0
          else
            echo "Found latest tag: $LATEST_TAG"
            CLEAN_TAG="${LATEST_TAG#v}"
            IFS='.' read -r -a PARTS <<< "$CLEAN_TAG"
            MAJOR="${PARTS[0]:-1}"
            MINOR="${PARTS[1]:-0}"
            PATCH="${PARTS[2]:-0}"
          fi

          BUMP_TYPE="${{ github.event.inputs.bump_type || 'patch' }}"

          if [ -z "$LATEST_TAG" ]; then
            NEW_MAJOR=1
            NEW_MINOR=0
            NEW_PATCH=0
          else
            case "$BUMP_TYPE" in
              major)
                NEW_MAJOR=$((MAJOR + 1))
                NEW_MINOR=0
                NEW_PATCH=0
                ;;
              minor)
                NEW_MAJOR=$MAJOR
                NEW_MINOR=$((MINOR + 1))
                NEW_PATCH=0
                ;;
              patch|*)
                NEW_MAJOR=$MAJOR
                NEW_MINOR=$MINOR
                NEW_PATCH=$((PATCH + 1))
                ;;
            esac
          fi

          NEW_VERSION="$NEW_MAJOR.$NEW_MINOR.$NEW_PATCH"
          TAG_NAME="v$NEW_VERSION"
          VERSION_CODE=$(( (NEW_MAJOR * 10000) + (NEW_MINOR * 100) + NEW_PATCH ))

          echo "Calculated Version: $NEW_VERSION"
          echo "Tag Name: $TAG_NAME"
          echo "Version Code: $VERSION_CODE"

          echo "VERSION_NAME=$NEW_VERSION" >> $GITHUB_ENV
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV

      - name: Run Detekt and Unit Tests
        run: ./gradlew detekt testReleaseUnitTest

      - name: Decode Release Keystore (if provided)
        id: keystore
        env:
          KEY_STORE_BASE64: ${{ secrets.KEY_STORE_BASE64 }}
        run: |
          if [ -n "$KEY_STORE_BASE64" ]; then
            echo "$KEY_STORE_BASE64" | base64 -d > app/keystore.jks
            echo "HAS_KEYSTORE=true" >> $GITHUB_ENV
          else
            echo "HAS_KEYSTORE=false" >> $GITHUB_ENV
          fi

      - name: Build Multi-Architecture APKs
        env:
          KEY_STORE_PATH: keystore.jks
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          APP_VERSION_NAME: ${{ env.VERSION_NAME }}
          APP_VERSION_CODE: ${{ env.VERSION_CODE }}
        run: |
          if [ "$HAS_KEYSTORE" = "true" ]; then
            ./gradlew assembleRelease assembleDebug -PversionName=${{ env.VERSION_NAME }} -PversionCode=${{ env.VERSION_CODE }}
          else
            ./gradlew assembleDebug -PversionName=${{ env.VERSION_NAME }} -PversionCode=${{ env.VERSION_CODE }}
          fi

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release-artifacts

          # Copy and rename debug/installable multi-arch APKs with standard naming
          if [ -d "app/build/outputs/apk/debug" ]; then
            for apk in app/build/outputs/apk/debug/app-*-debug.apk; do
              if [ -f "$apk" ]; then
                arch=$(basename "$apk" | sed -e 's/app-//' -e 's/-debug.apk//')
                cp "$apk" "release-artifacts/android-logs-${{ env.TAG_NAME }}-${arch}.apk"
              fi
            done
          fi

          # Copy release APKs if built
          if [ -d "app/build/outputs/apk/release" ]; then
            for apk in app/build/outputs/apk/release/app-*-release.apk; do
              if [ -f "$apk" ]; then
                arch=$(basename "$apk" | sed -e 's/app-//' -e 's/-release.apk//')
                cp "$apk" "release-artifacts/android-logs-${{ env.TAG_NAME }}-${arch}-release.apk"
              fi
            done
          fi

          ls -la release-artifacts/

      - name: Upload Artifacts to Workflow
        uses: actions/upload-artifact@v4
        with:
          name: android-logs-${{ env.TAG_NAME }}-apks
          path: release-artifacts/*.apk
          retention-days: 30

      - name: Create GitHub Release & Git Tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Release ${{ env.TAG_NAME }}
          generate_release_notes: true
          files: release-artifacts/*.apk
